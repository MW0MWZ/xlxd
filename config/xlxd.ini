# xlxd.ini - XLXd settings
#
# Usage:     xlxd /xlxd/xlxd.ini
# Left out:  uses the default in main.h
# Bad value: logged and ignored
#
# xlxd checks this file every 3 minutes and reloads it if it has changed.
# Each setting says when a change takes effect:
#   Needs a restart if you change this
#           read once at start-up, xlxd keeps the old value until it is
#           restarted
#   Live    picked up at the next reload, within 3 minutes, no restart

[Reflector]
# Reflector callsign, XLX followed by 3 characters.
# Needs a restart if you change this.
CALLSIGN=XLX999

# IP to listen on. 0.0.0.0, every address on this machine, is correct
# in most cases. The IP the reflector reports when it calls home is not
# set here, it is OverrideIPAddress in the dashboard's config.inc.php.
# Needs a restart if you change this.
LISTEN_IP=0.0.0.0

# IP of AMBEd, 127.0.0.1 if it is on this machine.
# Needs a restart if you change this.
TRANSCODER_IP=127.0.0.1

[Network]
# Mark voice packets for QoS: 1 or 0. Live, from the next packet.
DSCP_MARKING_ENABLE=1

# DSCP value, 0 to 63. 46 is EF, highest priority voice.
# Live, from the next packet.
DSCP_VALUE=46

[Ports]
# ------------------------------------------------------------------------
# UDP ports xlxd listens on. All need a restart if you change them.
# Leave these alone unless you know you need to change them: clients,
# hotspots and peers expect the standard ports. Changing one only moves
# where xlxd listens, connections out to peers still use the standard
# ports.
# ------------------------------------------------------------------------
#DEXTRA_PORT=30001
#DPLUS_PORT=20001
#DCS_PORT=30051
#XLX_PORT=10002
#DMRPLUS_PORT=8880
#DMRMMDVM_PORT=62030
#YSF_PORT=42000
#IMRS_PORT=21110
#M17_PORT=17000

# G3 terminal mode. Icom radios use fixed ports, so changing these breaks G3.
#G3_PRESENCE_PORT=12346
#G3_CONFIG_PORT=12345
#G3_DV_PORT=40000

# Dashboard JSON monitor
#JSON_PORT=10001

# AMBEd, used at both ends, must match LISTEN_PORT in ambed.ini
#TRANSCODER_PORT=10100

[YSF]
# Link YSF stations to a module as soon as they connect: 1 or 0
# Without it they stay unlinked until they pick a module with Wires-X.
# Live: picked up at the next reload, no restart. Stations already
# connected stay where they are, the change applies to stations that
# connect after the reload.
AUTOLINK_ENABLE=1

# Module YSF stations link to on connect, A to Z.
# Live: picked up at the next reload, no restart. Stations already
# connected stay where they are, the change applies to stations that
# connect after the reload.
AUTOLINK_MODULE=B

# Frequencies reported to Wires-X for a node that isn't in the
# YSF node database, in Hz. Live.
#DEFAULT_NODE_TX_FREQ=437000000
#DEFAULT_NODE_RX_FREQ=437000000

[IMRS]
# Module IMRS repeaters link to, A to Z.
# Live: picked up at the next reload, no restart. Repeaters already
# connected stay where they are, the change applies to repeaters that
# connect after the reload.
AUTOLINK_MODULE=B

[Gain]
# ------------------------------------------------------------------------
# AMBE level trims, in dB, -90 to +90. All live, from the next frame.
#
# The aim is to balance YSF and NXDN levels with DMR.
#
# DMR, YSF and NXDN share a codec, so audio passes between them without
# going through AMBEd, and AMBEd's gains and AGC never touch it. These
# trims are the only level control on that path. They work by changing
# the gain value inside each AMBE frame, not by processing audio.
#
# Inside the reflector all AMBE audio is held as DMR AMBE. YSF and NXDN
# are converted to DMR as they arrive, and back from DMR as they leave,
# much like AMBEd's <MODE>_TO_PCM and PCM_TO_<MODE>:
#   <MODE>_TO_DMR  applies to all audio arriving over that mode, whatever
#                  mode it goes out on, D-Star and M17 included
#   DMR_TO_<MODE>  applies to all audio sent out over that mode, whatever
#                  mode it came from
# YSF to YSF gets both YSF adjustments.
#
# 0 turns an adjustment off.
# ------------------------------------------------------------------------

# Audio arriving over YSF
YSF_TO_DMR=10

# Audio sent out over YSF
DMR_TO_YSF=-4

# Audio arriving from NXDN peers
NXDN_TO_DMR=-3

# Audio sent to NXDN peers
DMR_TO_NXDN=-3

[Files]
# ------------------------------------------------------------------------
# File locations, full paths. All need a restart if you change them.
# ------------------------------------------------------------------------
# Process ID, read by the dashboard and by systemd
#PID_PATH=/var/log/xlxd.pid

#WHITELIST_PATH=/xlxd/xlxd.whitelist
#BLACKLIST_PATH=/xlxd/xlxd.blacklist
#INTERLINK_PATH=/xlxd/xlxd.interlink
#TERMINAL_PATH=/xlxd/xlxd.terminal

# Reflector status for the dashboard
#XML_PATH=/var/log/xlxd.xml

# ID databases, only used when xlxd is built to read them from local files
# instead of downloading them (*_USE_RLX_SERVER 0 in main.h)
#DMRIDDB_PATH=/xlxd/dmrid.dat
#YSFNODEDB_PATH=/xlxd/ysfnode.dat
#NXDNIDDB_PATH=/xlxd/nxdn.csv
